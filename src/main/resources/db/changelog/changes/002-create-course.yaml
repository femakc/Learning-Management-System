databaseChangeLog:
  - changeSet:
      id: 2-create-course
      author: max
      changes:
        - createTable:
            tableName: courses
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: external_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_date
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: last_modified_date
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: varchar(1000)
                  constraints:
                    nullable: true