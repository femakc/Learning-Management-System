version: '3.9'

services:

  postgres:
    image: postgres:16

    container_name: postgres-db-lms

    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
        - lms-network

  app:
    build: .
    container_name: lms-spring-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      #PROFILE
      SPRING_PROFILES_ACTIVE: docker
      #DB
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lms_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lms_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      #HIBERNATE
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      SPRING_LIQUIBASE_ENABLED: ${LIQUIBASE_ENABLED:-true}

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms-network

volumes:
  postgres_data:

networks:
  lms-network:
    name: lms-network
    driver: bridge